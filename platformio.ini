; =============================================================================
;  PMeMS CONTROLLER 1 - Day chuyen chinh goc & dan tem nap lon (Nam Viet F&B)
;  MCU   : STM32F407VET6 (168 MHz, 512 KB Flash, 192 KB RAM)
;  SDK   : STM32Cube HAL (framework = stm32cube) + FreeRTOS / CMSIS-RTOS v2
;  Spec  : docs/FIRMWARE_PROCESS_SPEC.md (REV 3.2)
; =============================================================================

[platformio]
default_envs = controller1

[env]
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter

; -----------------------------------------------------------------------------
; Firmware cho board dieu khien chinh
; -----------------------------------------------------------------------------
[env:controller1]
platform = ststm32
board = genericSTM32F407VET6
framework = stm32cube
board_build.f_cpu = 168000000L
; Dung file include/stm32f4xx_hal_conf.h cua du an thay vi template mac dinh
board_build.stm32cube.custom_config_header = yes

; FreeRTOS + CMSIS-RTOS v2 duoc build tu goi framework-stm32cubef4
; (Middlewares/Third_Party/FreeRTOS) - xem scripts/freertos.py
extra_scripts = pre:scripts/freertos.py
custom_freertos_heap = heap_4

build_flags =
    ${env.build_flags}
    -std=gnu11
    -Iinclude
    -Isrc/core
    -Isrc/bsp
    -Isrc/app
    -DAPP_FIRMWARE_REV=\"3.2.0\"

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

; -----------------------------------------------------------------------------
; Unit test tren may tinh (khong can phan cung):  pio test -e native
; Kiem thu thu vien lib/pmems_core (CRC16, Vision protocol, FIFO, Modbus, ramp)
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -std=gnu11
    -lm
